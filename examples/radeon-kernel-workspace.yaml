# Replace the illustrative aliases, directories and images with your own.
# Source/Git already live in each remote_root; targets are independent.
schema_version: 2
default_target: r9700

targets:
  r9700:
    ssh_host: my-r9700
    remote_root: /home/my-user/projects/radeon-kernels
    container:
      image: registry.example.com/team/rocm-dev:2026.10
      shell: /bin/bash
      devices: [/dev/kfd, /dev/dri]
      security_options: [seccomp=unconfined]
      mounts:
        - source: /data/models
          target: /models
          read_only: true
  halo:
    ssh_host: my-halo
    remote_root: /home/my-user/projects/radeon-kernels
    container:
      image: registry.example.com/team/halo-dev:2026.10
      shell: /bin/bash
      devices: [/dev/kfd, /dev/dri]
      security_options: [seccomp=unconfined]
